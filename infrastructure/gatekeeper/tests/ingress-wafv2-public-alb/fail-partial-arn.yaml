# Prefix only — must be full regional webacl ARN with UUID id segment
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test
  namespace: x
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-southeast-2:123456789012:regional/webacl/foo
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: s
                port:
                  number: 80
