# Same shape as fail case but namespace is excluded by Constraint (kube-system).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test
  namespace: kube-system
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: s
                port:
                  number: 80
