apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sIngressWafV2
metadata:
  labels:
    owner: platform
  name: public-alb-ingress-must-refer-wafv2
spec:
  # Promotion to deny is gated on real regional WAFv2 ACL ARNs being available
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: ["networking.k8s.io"]
        kinds: ["Ingress"]
    # Central exceptions only (same pattern as namespaces-must-have-owner).
    # Add lab or vendor namespaces here or via policies/overlays/<cluster>/ patches.
    excludedNamespaces:
      - kube-system
      - gatekeeper-system
      - argocd
      - aws-secrets-manager
      - cert-manager
      - external-dns
      - fluent-bit
      - kube-state-metrics
      - mount-s3
      - prometheus-node-exporter
