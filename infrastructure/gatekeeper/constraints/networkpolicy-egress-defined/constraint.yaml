apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sNetworkPolicyEgress
metadata:
  labels:
    owner: platform
  name: networkpolicy-egress-explicit
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: ["networking.k8s.io"]
        kinds: ["NetworkPolicy"]
  parameters:
    enforcedNamespacePrefixes: []
